<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photo Carousel</title>
    </head>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <body>
        <h1>The Story of My Dog Coco</h1>
        <div class="carousel">
                <div class="carousel-images">
    <img id="image1" src="images/meet.jpg" alt="Image 1" class="image">
    <img id="image2" src="images/smell.jpg" alt="Image 2" class="image">
    <img id="image3" src="images/sleep.jpg" alt="Image 3" class="image">
                </div>
        </div>
        <div>
         <p class="instruction">Click the buttons to see different stories</p>
        </div>
        <div class="button">
            <button id="sequence-one">Story 1</button>
            <button id="sequence-two">Story 2</button>
        </div>
    </body>
</html>
